<svg width="1320" height="500" viewBox="0 0 1320 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="50%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#14042e"/>
    </linearGradient>
    <linearGradient id="s4purpleblock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1a7a"/>
      <stop offset="100%" stop-color="#220e55"/>
    </linearGradient>
    <linearGradient id="s4navyblock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e2e"/>
      <stop offset="100%" stop-color="#16103e"/>
    </linearGradient>
    <linearGradient id="s4accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7733ff"/>
      <stop offset="100%" stop-color="#4400cc"/>
    </linearGradient>
    <linearGradient id="s4gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <linearGradient id="s4titlegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ddccff"/>
      <stop offset="100%" stop-color="#aa77ff"/>
    </linearGradient>
    <linearGradient id="s4btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7733ff"/>
      <stop offset="100%" stop-color="#5500ee"/>
    </linearGradient>
    <radialGradient id="s4glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7733ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7733ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="s4blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="s4softblur"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="s4clip">
      <rect width="1320" height="500"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1320" height="500" fill="url(#s4bg)"/>

  <!-- Background glow blob -->
  <ellipse cx="660" cy="250" rx="500" ry="280" fill="url(#s4glow)" filter="url(#s4softblur)"/>

  <!-- === GEOMETRIC PARALLELOGRAM TILES === -->
  <!-- Left column tiles (purple) -->
  <!-- Top-left tile -->
  <polygon points="20,10 200,10 170,130 -10,130" fill="url(#s4purpleblock)" opacity="0.95"/>
  <polygon points="20,10 200,10 170,130 -10,130" fill="none" stroke="#7733ff" stroke-width="1" opacity="0.4"/>

  <!-- Second tile left -->
  <polygon points="-10,150 170,150 140,280 -40,280" fill="url(#s4navyblock)" opacity="0.9"/>
  <polygon points="-10,150 170,150 140,280 -40,280" fill="none" stroke="#4422aa" stroke-width="1" opacity="0.35"/>

  <!-- Third tile left -->
  <polygon points="-30,300 150,300 120,430 -60,430" fill="url(#s4purpleblock)" opacity="0.85"/>
  <polygon points="-30,300 150,300 120,430 -60,430" fill="none" stroke="#7733ff" stroke-width="1" opacity="0.3"/>

  <!-- Right column tiles (navy/dark purple) -->
  <!-- Top-right tile -->
  <polygon points="1150,10 1330,10 1360,130 1180,130" fill="url(#s4navyblock)" opacity="0.9"/>
  <polygon points="1150,10 1330,10 1360,130 1180,130" fill="none" stroke="#3322aa" stroke-width="1" opacity="0.4"/>

  <!-- Middle-right tile -->
  <polygon points="1180,160 1360,160 1390,290 1210,290" fill="url(#s4purpleblock)" opacity="0.85"/>
  <polygon points="1180,160 1360,160 1390,290 1210,290" fill="none" stroke="#7733ff" stroke-width="1" opacity="0.35"/>

  <!-- Bottom-right tile -->
  <polygon points="1160,320 1340,320 1370,450 1190,450" fill="url(#s4navyblock)" opacity="0.8"/>
  <polygon points="1160,320 1340,320 1370,450 1190,450" fill="none" stroke="#4422aa" stroke-width="1" opacity="0.3"/>

  <!-- Center subtle arc (like original's curved bg element) -->
  <path d="M400,0 Q800,-100 1200,200" stroke="#7733ff" stroke-width="80" fill="none" opacity="0.06" filter="url(#s4blur)"/>
  <path d="M400,0 Q800,-100 1200,200" stroke="#aa55ff" stroke-width="2" fill="none" opacity="0.12"/>

  <!-- Subtle horizontal grid lines center -->
  <g opacity="0.05" stroke="#9966ff" stroke-width="0.5">
    <line x1="200" y1="100" x2="1120" y2="100"/>
    <line x1="200" y1="160" x2="1120" y2="160"/>
    <line x1="200" y1="220" x2="1120" y2="220"/>
    <line x1="200" y1="280" x2="1120" y2="280"/>
    <line x1="200" y1="340" x2="1120" y2="340"/>
    <line x1="200" y1="400" x2="1120" y2="400"/>
  </g>

  <!-- === LOGO MARK (top-left, like original) === -->
  <!-- 4-square windows logo -->
  <rect x="200" y="380" width="18" height="18" rx="2" fill="#6633ee"/>
  <rect x="222" y="380" width="18" height="18" rx="2" fill="#6633ee"/>
  <rect x="200" y="402" width="18" height="18" rx="2" fill="#6633ee"/>
  <rect x="222" y="402" width="18" height="18" rx="2" fill="#6633ee"/>

  <!-- Brand name next to logo -->
  <text x="252" y="415" font-family="'Georgia', serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="2">SARATOFFICE</text>

  <!-- Thin underline accent -->
  <rect x="252" y="420" width="200" height="1.5" rx="1" fill="url(#s4accent)"/>

  <!-- === MAIN TITLE CENTER === -->
  <!-- Large display text -->
  <text x="660" y="155" font-family="'Georgia', serif" font-size="72" font-weight="700" fill="url(#s4titlegrad)" text-anchor="middle" letter-spacing="4">SARAT OFFICE</text>

  <!-- Subtitle -->
  <text x="660" y="195" font-family="'Trebuchet MS', sans-serif" font-size="18" fill="#9966ff" text-anchor="middle" letter-spacing="8">B E Y O N D   T H E   W O R L D</text>

  <!-- Purple accent divider -->
  <rect x="410" y="214" width="500" height="2" rx="1" fill="url(#s4accent)" opacity="0.6"/>
  <!-- Gold dot center -->
  <circle cx="660" cy="215" r="4" fill="url(#s4gold)"/>

  <!-- Description -->
  <text x="660" y="252" font-family="'Trebuchet MS', sans-serif" font-size="16" fill="#c4aaee" text-anchor="middle">Your Gateway to Government Resources, Smart Tools &amp; Official Portals</text>

  <!-- 4 feature pill tags -->
  <rect x="340" y="280" width="140" height="32" rx="16" fill="#3311aa" opacity="0.6"/>
  <rect x="340" y="280" width="140" height="32" rx="16" fill="none" stroke="#6644dd" stroke-width="1"/>
  <text x="410" y="301" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#bb99ff" text-anchor="middle" letter-spacing="1">GOVT ORDERS</text>

  <rect x="494" y="280" width="120" height="32" rx="16" fill="#440088" opacity="0.6"/>
  <rect x="494" y="280" width="120" height="32" rx="16" fill="none" stroke="#9933ff" stroke-width="1"/>
  <text x="554" y="301" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#dd88ff" text-anchor="middle" letter-spacing="1">PDF LIBRARY</text>

  <rect x="628" y="280" width="120" height="32" rx="16" fill="#003388" opacity="0.6"/>
  <rect x="628" y="280" width="120" height="32" rx="16" fill="none" stroke="#3366ff" stroke-width="1"/>
  <text x="688" y="301" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#88aaff" text-anchor="middle" letter-spacing="1">CALC TOOLS</text>

  <rect x="762" y="280" width="120" height="32" rx="16" fill="#005544" opacity="0.6"/>
  <rect x="762" y="280" width="120" height="32" rx="16" fill="none" stroke="#00aa88" stroke-width="1"/>
  <text x="822" y="301" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#44ddbb" text-anchor="middle" letter-spacing="1">WEB LINKS</text>

  <!-- Stats row -->
  <rect x="360" y="336" width="600" height="70" rx="10" fill="#ffffff" opacity="0.03"/>
  <rect x="360" y="336" width="600" height="70" rx="10" fill="none" stroke="#7733ff" stroke-width="0.6" opacity="0.4"/>

  <!-- Stat 1 -->
  <text x="460" y="366" font-family="'Georgia', serif" font-size="26" font-weight="700" fill="#ffcc00" text-anchor="middle">500+</text>
  <text x="460" y="385" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#9988cc" text-anchor="middle">Govt. Documents</text>

  <!-- Divider -->
  <rect x="559" y="346" width="1" height="50" fill="#7733ff" opacity="0.4"/>

  <!-- Stat 2 -->
  <text x="660" y="366" font-family="'Georgia', serif" font-size="26" font-weight="700" fill="#aa77ff" text-anchor="middle">FREE</text>
  <text x="660" y="385" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#9988cc" text-anchor="middle">Always &amp; Forever</text>

  <!-- Divider -->
  <rect x="759" y="346" width="1" height="50" fill="#7733ff" opacity="0.4"/>

  <!-- Stat 3 -->
  <text x="860" y="366" font-family="'Georgia', serif" font-size="26" font-weight="700" fill="#44ddbb" text-anchor="middle">24/7</text>
  <text x="860" y="385" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#9988cc" text-anchor="middle">Online Access</text>

  <!-- URL CTA -->
  <rect x="510" y="428" width="300" height="48" rx="24" fill="url(#s4btn)"/>
  <rect x="510" y="428" width="300" height="48" rx="24" fill="none" stroke="#aa55ff" stroke-width="1.5"/>
  <text x="660" y="458" font-family="'Georgia', serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">WWW.SARATOFFICE.IN</text>

  <!-- Top right corner brand watermark -->
  <text x="1140" y="50" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="#4422aa" text-anchor="end" letter-spacing="3" opacity="0.6">SARATOFFICE.IN</text>
</svg>
